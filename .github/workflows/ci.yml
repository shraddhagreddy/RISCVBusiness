name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make autoconf g++ flex bison libfl2 libfl-dev zlib1g zlib1g-dev

      - name: Build and install latest Verilator
        run: |
          git clone https://github.com/verilator/verilator.git
          cd verilator
          git checkout v5.020   # latest stable (supports -Wno-ENUMVALUE)
          autoconf
          ./configure
          make -j$(nproc)
          sudo make install
          verilator --version

      - name: Run SoCET CI (default tests)
        uses: Purdue-SoCET/SoCET-CI@main

